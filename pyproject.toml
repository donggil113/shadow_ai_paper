[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-censored-learning"
version = "0.1.0"
description = "Sharp ranking bounds and minimax prediction under selective labels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", "scipy>=1.10", "pandas>=2.0",
    "scikit-learn>=1.3", "matplotlib>=3.7",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["dcl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]
